services:
  - type: web
    name: remesh-shop
    runtime: python
    plan: free
    # Same AWS region as the Neon database (US East 2, Ohio).
    region: ohio
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --log-file -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.5"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: HTTPS
        value: "1"
      - key: SERVE_MEDIA
        value: "1"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # Secrets and per-deployment values: filled in by hand in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: NOVA_POSHTA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
